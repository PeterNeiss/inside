# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # A pinned clang-format: system clang-format versions format differently.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        exclude: ^docs/proposal/examples/ # hand-aligned listings quoted by the proposal

  # CMake formatting
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.28.0
    hooks:
      - id: gersemi

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

exclude: '^(single_include/|docs/int-considered-harmful/)'
