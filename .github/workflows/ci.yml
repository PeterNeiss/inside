name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.config }}
    runs-on: ubuntu-latest
    # The library needs GCC 16 (C++26 static reflection).
    container:
      image: gcc:16
      # TSan runs itself again with ASLR off (personality), which Docker's default seccomp profile refuses:
      # "ThreadSanitizer: encountered an incompatible memory layout but was unable to disable ASLR".
      options: ${{ matrix.config == 'release-tsan' && '--security-opt seccomp=unconfined' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes run every build option once; the weekly run
        # (and workflow_dispatch) adds the slow tests, the certify test over
        # every certified pair, and TSan.
        config: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["debug-maxsan", "release", "release-nofp", "debug-werror", "debug-slow", "release-certify-full", "release-tsan"]'
          || '["debug-maxsan", "release", "release-nofp", "debug-werror"]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Install CMake, Ninja, Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ninja-build python3 python3-pip
          pip3 install --break-system-packages cmake
      - name: Configure
        shell: bash
        run: |
          san="-fsanitize=address,leak,pointer-compare,pointer-subtract,undefined -fsanitize-undefined-trap-on-error"
          case "${{ matrix.config }}" in
            debug-maxsan)         args=(-DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=$san") ;;
            release)              args=(-DCMAKE_BUILD_TYPE=Release) ;;
            release-nofp)         args=(-DCMAKE_BUILD_TYPE=Release -DINSIDE_MATH_NO_FP=ON) ;;
            debug-werror)         args=(-DCMAKE_BUILD_TYPE=Debug -DINSIDE_WARNINGS_AS_ERRORS=ON) ;;
            debug-slow)           args=(-DCMAKE_BUILD_TYPE=Debug -DINSIDE_SLOW_TESTS=ON) ;;
            release-certify-full) args=(-DCMAKE_BUILD_TYPE=Release -DINSIDE_CERTIFY_FULL=ON) ;;
            release-tsan)         args=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-fsanitize=thread) ;;
          esac
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_STANDARD=26 "${args[@]}"
      - name: Build
        run: cmake --build build --target all all_verify_interface_header_sets
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"
