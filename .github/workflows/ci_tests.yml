name: Continuous Integration Tests

on:
  push:
    branches:
      - main
      - pureCPP26
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 6'

concurrency:
  group: ${{format('{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

jobs:
  beman-submodule-check:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-submodule-check.yml@1.7.4

  # inside requires C++26 with static reflection, which GCC 16 alone provides
  # (-freflection). PRs and pushes run every build option once; the weekly run
  # (and workflow_dispatch) adds Debug, TSan and the certify test over every
  # certified pair (BEMAN_INSIDE_CERTIFY_FULL).
  preset-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-preset-test.yml@1.7.4
    with:
      matrix_config: >
        [
          {"preset": "gcc-debug", "image": "ghcr.io/bemanproject/infra-containers-gcc:16"}
        ]

  build-and-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-build-and-test.yml@1.7.4
    with:
      matrix_config: >
        {
          "gcc": [
            { "versions": ["16"],
              "tests": [
                { "cxxversions": ["c++26"],
                  "tests": [
                    { "stdlibs": ["libstdc++"],
                      "tests": [
                        "Release.Default", "Release.MaxSan", "Debug.Werror",
                        "Debug.Coverage", "Release.-DBEMAN_INSIDE_MATH_NO_FP=ON",
                        "Debug.-DBEMAN_INSIDE_STRICT_SFINAE=ON"
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }

  preset-test-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-preset-test.yml@1.7.4
    with:
      matrix_config: >
        [
          {"preset": "gcc-debug", "image": "ghcr.io/bemanproject/infra-containers-gcc:16"},
          {"preset": "gcc-release", "image": "ghcr.io/bemanproject/infra-containers-gcc:16"}
        ]

  build-and-test-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-build-and-test.yml@1.7.4
    with:
      matrix_config: >
        {
          "gcc": [
            { "versions": ["16"],
              "tests": [
                { "cxxversions": ["c++26"],
                  "tests": [
                    { "stdlibs": ["libstdc++"],
                      "tests": [
                        "Debug.Default", "Release.Default", "Release.TSan",
                        "Release.MaxSan", "Debug.Werror", "Debug.Coverage",
                        "Release.-DBEMAN_INSIDE_MATH_NO_FP=ON",
                        "Debug.-DBEMAN_INSIDE_STRICT_SFINAE=ON",
                        "Release.-DBEMAN_INSIDE_CERTIFY_FULL=ON"
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }

  vcpkg-ci:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-vcpkg-ci.yml@1.7.4
    with:
      port_name: beman-inside
      container_image: ghcr.io/bemanproject/infra-containers-gcc:16

  create-issue-when-fault:
    needs: [preset-test, build-and-test, preset-test-full, build-and-test-full]
    if: failure() && github.event_name == 'schedule'
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-create-issue-when-fault.yml@1.7.4
